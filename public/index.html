<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="AchieveUp - Micro-Credentialling System"
    />
    <title>AchieveUp</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function () {
        // Applies the dark class before React mounts, so there's no flash of
        // the wrong theme on first paint. ThemeProvider (src/contexts/ThemeContext.tsx)
        // owns the actual state afterward and keeps this in sync.
        try {
          var stored = localStorage.getItem('achieveup-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage/matchMedia unavailable — default to light, no-op */
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
