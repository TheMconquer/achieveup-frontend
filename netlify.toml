[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_ENVIRONMENT = "production"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 
# CRA fingerprints everything under /static, so it can be cached forever.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Content-Security-Policy: scripts only from this site, so injected HTML can't
# run code. Styles allow 'unsafe-inline' because react-hot-toast adds a style
# tag at runtime. Images may come from any https host (YouTube thumbnails,
# images in Canvas questions). connect-src must include the backend: if
# REACT_APP_API_URL changes, change it here too, or every API call is blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://gen-ai-prime-3ddeabb35bd7.herokuapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Shared badge links open for anyone with the URL but stay out of search results.
[[headers]]
  for = "/badges/share/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
